name: Contracts CI

permissions: {}

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_KYBER_TAG: nightly-04bdb43d9435cecec89abc17b3dcb618086c0d99

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry Kyber
        working-directory: ${{ github.workspace }}
        run: |
          scripts/install-foundry-kyber.sh
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Show Forge version
        run: forge-kyber --version

      - name: Run Forge fmt
        run: forge-kyber fmt --check

      - name: Run Forge build
        run: forge-kyber build --sizes

      - name: Run Forge tests
        run: forge-kyber test -vvv
